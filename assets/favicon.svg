<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="faviBg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F1B3D"/>
      <stop offset="100%" stop-color="#050817"/>
    </radialGradient>
    <linearGradient id="faviRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#faviBg)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="35" cy="40" r="1"/>
    <circle cx="165" cy="35" r="1.2"/>
    <circle cx="175" cy="160" r="1"/>
    <circle cx="30" cy="165" r="0.8"/>
  </g>
  <!-- Orbital ellipse -->
  <ellipse cx="100" cy="100" rx="66" ry="22" fill="none" stroke="#4FC3F7" stroke-width="1.2" opacity="0.35" transform="rotate(-25 100 100)"/>
  <!-- Main ring -->
  <circle cx="100" cy="100" r="51" fill="none" stroke="url(#faviRing)" stroke-width="5.5"/>
  <!-- Inner shadow -->
  <circle cx="100" cy="100" r="47" fill="#0F1B3D" opacity="0.3"/>
  <!-- Star accent -->
  <g transform="translate(122 86)">
    <path d="M 0,-11 C 1.5,-3 3,-1.5 11,0 3,1.5 1.5,3 0,11 -1.5,3 -3,-1.5 -11,0 -3,-1.5 -1.5,-3 0,-11 Z" fill="#FFF8E1"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFD54F"/>
  </g>
  <!-- Arc highlight -->
  <path d="M 65,88 A 51,51 0 0 1 88,64" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
</svg>
